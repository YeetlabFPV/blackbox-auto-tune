name: Desktop beta
on:
  push:
    branches: [main]
    paths: ['.github/workflows/macos-beta.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build signed disk image
        run: bash build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: outputs/Blackbox-Auto-Tune-macOS-arm64.dmg
          if-no-files-found: error
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          install: git mingw-w64-ucrt-x86_64-gcc
      - name: Build official Blackbox decoder
        shell: msys2 {0}
        run: bash windows/build-decoder.sh
      - name: Package and test the Windows app
        shell: pwsh
        run: |
          python -m pip install numpy==2.0.2 pyinstaller==6.17.0
          python -m PyInstaller --noconfirm --windowed --name Blackbox-Auto-Tune --paths outputs --add-data "windows/blackbox_decode.exe:." windows/app.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tests/chirp_fixture.py chirp-fixture.bbl
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $app = 'dist/Blackbox-Auto-Tune/Blackbox-Auto-Tune.exe'
          $smoke = Start-Process $app -ArgumentList '--smoke-test', 'chirp-fixture.bbl', 'smoke-result.json' -PassThru -Wait
          if ($smoke.ExitCode -ne 0 -or -not (Test-Path smoke-result.json)) { throw "Packaged analyzer failed the chirp smoke test." }
          Copy-Item work/blackbox-tools/LICENSE 'dist/Blackbox-Auto-Tune/Blackbox Tools License.txt'
          git -C work/blackbox-tools archive --format=zip --prefix=blackbox-tools/ -o "$PWD/dist/Blackbox-Auto-Tune/Blackbox-Tools-Source.zip" HEAD
          Compress-Archive -Path dist/Blackbox-Auto-Tune -DestinationPath Blackbox-Auto-Tune-Windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Blackbox-Auto-Tune-Windows-x64.zip
          if-no-files-found: error
  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Publish beta
        run: |
          gh release create v0.3.0-beta --target "$GITHUB_SHA" --prerelease \
            --title 'Blackbox Auto-Tune v0.3.0 beta' \
            --notes 'Adds marked Betaflight 2026.6 Chirp response plots and a Windows x64 app. On Windows, extract the whole ZIP and run Blackbox-Auto-Tune.exe. On Apple Silicon with macOS 14+, open the DMG and drag the app to Applications. Both packages bundle the analysis engine and decoder. The beta packages are not publisher-signed.' \
            release/Blackbox-Auto-Tune-macOS-arm64.dmg release/Blackbox-Auto-Tune-Windows-x64.zip
